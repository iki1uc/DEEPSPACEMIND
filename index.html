<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DEEPSPACEMIND · ALLXALL INDEX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    margin:0;
    overflow:hidden;
}
canvas {
    position:absolute;
    top:0;
    left:0;
}
#panel {
    position:absolute;
    right:20px;
    top:20px;
    width:420px;
    background:#111;
    border:1px solid #333;
    padding:20px;
    border-radius:8px;
}
pre {
    background:#000;
    padding:10px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}
h2 {
    color:#6cf;
    margin-top:0;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="panel">
    <h2>DEEPSPACEMIND · ALLXALL CORE</h2>
    <pre id="coreOut">Init…</pre>
    <pre id="stateOut">State…</pre>
    <pre id="orbitOut">Orbit…</pre>
    <pre id="silverOut">Silver…</pre>
    <pre id="goldOut">Gold…</pre>
    <pre id="metaOut">Meta…</pre>
</div>

<script type="module">
import { DEEPSPACEMIND_CORE } from "./core.js";
import stateGraph from "./state.graph.json" assert { type: "json" };
import { ORBIT_GRAPH } from "./orbit.graph.js";
import silverMap from "../81/silver/semantik.map.json" assert { type: "json" };
import goldMap from "../81/gold/intention.graph.json" assert { type: "json" };
import metaSchema from "../81/meta/deepspace.schema" assert { type: "json" };

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* -----------------------------------------
   1. DEEPSPACEMIND CORE
----------------------------------------- */
const mind = DEEPSPACEMIND_CORE.full("ALLXALL");
document.getElementById("coreOut").innerText =
    JSON.stringify(mind, null, 2);

/* -----------------------------------------
   2. STATE GRAPH
----------------------------------------- */
document.getElementById("stateOut").innerText =
    JSON.stringify(stateGraph, null, 2);

/* -----------------------------------------
   3. ORBIT GRAPH
----------------------------------------- */
const orbit = {
    alpha: ORBIT_GRAPH.hh_alpha(0),
    beta: ORBIT_GRAPH.hh_beta(0)
};
document.getElementById("orbitOut").innerText =
    JSON.stringify(orbit, null, 2);

/* -----------------------------------------
   4. SILVER LAYER
----------------------------------------- */
document.getElementById("silverOut").innerText =
    JSON.stringify(silverMap, null, 2);

/* -----------------------------------------
   5. GOLD LAYER
----------------------------------------- */
document.getElementById("goldOut").innerText =
    JSON.stringify(goldMap, null, 2);

/* -----------------------------------------
   6. META LAYER
----------------------------------------- */
document.getElementById("metaOut").innerText =
    JSON.stringify(metaSchema, null, 2);

/* -----------------------------------------
   7. VISUALISIERUNG
----------------------------------------- */
let t = 0;

function drawPlanet(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
}

function drawSatellite(x, y, label) {
    ctx.fillStyle = "#6cf";
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x - 10, y - 20);
}

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Erde
    drawPlanet(canvas.width*0.25, canvas.height*0.7, 80, "#0f0");

    // Mond
    drawPlanet(canvas.width*0.75, canvas.height*0.3, 50, "#ccc");

    // DEEPSPACEMIND Zentrum
    drawPlanet(canvas.width*0.5, canvas.height*0.5, 40, "#f0f");

    // HH Satelliten
    const alpha = ORBIT_GRAPH.hh_alpha(t/40);
    const beta  = ORBIT_GRAPH.hh_beta(t/40);

    drawSatellite(canvas.width/2 + alpha.x, canvas.height/2 + alpha.y, "HH‑A");
    drawSatellite(canvas.width/2 + beta.x,  canvas.height/2 + beta.y,  "HH‑B");

    // RUN Impulse
    ctx.fillStyle = "#0f0";
    ctx.beginPath();
    ctx.arc(
        canvas.width/2 + Math.sin(t/20)*250,
        canvas.height/2 + Math.cos(t/20)*250,
        10, 0, Math.PI*2
    );
    ctx.fill();

    t++;
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
