<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DEEPSPACEMIND · Hyper Version</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; margin:0; overflow:hidden; }
canvas { position:absolute; top:0; left:0; }
#panel { position:absolute; right:20px; top:20px; width:380px; background:#111; padding:20px; border-radius:8px; }
pre { background:#000; padding:10px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<canvas id="space"></canvas>
<div id="panel">
    <h2>DEEPSPACEMIND · CORE</h2>
    <pre id="out">Init…</pre>
</div>

<script type="module">
import { DEEPSPACEMIND_CORE } from "./core.js";

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const mind = DEEPSPACEMIND_CORE.full("INIT");
document.getElementById("out").innerText = JSON.stringify(mind, null, 2);

let t = 0;

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#f0f";
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, 40, 0, Math.PI*2);
    ctx.fill();

    t++;
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
